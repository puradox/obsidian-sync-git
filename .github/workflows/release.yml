name: Publish container image

# Build a multi-arch image and push it to GitHub Container Registry (GHCR) on
# every published release. Also runnable manually (publishes a short-sha tag).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # puradox/obsidian-sync-git

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + Buildx enable the linux/arm64 build (the Dockerfile already
      # selects the right supercronic arch and better-sqlite3 prebuilds).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags + OCI labels. On a full (non-prerelease) release a semver tag
      # like v1.2.3 yields 1.2.3 / 1.2 / 1 / latest; a prerelease skips `latest`.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,format=short

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Also read CI's cache: a release typically follows a merge to main
          # that CI just built, so its amd64 layers are already warm.
          cache-from: |
            type=gha,scope=release
            type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=release
          # SLSA provenance + SBOM attestations (best practice for a pulled-and-run
          # image). These appear as extra "unknown/unknown" manifests in the GHCR
          # package UI — that's expected. Set both to false to drop them.
          provenance: mode=max
          sbom: true
