name: Release

# Cut a release by pushing a semver tag:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# That single tag push drives everything below — no manual GitHub UI step:
#   1. github-release  — creates the GitHub Release with auto-generated notes.
#   2. build-and-push  — builds the multi-arch image and pushes it to GHCR.
#
# The tag is the single source of truth. (We deliberately do NOT trigger off
# `release: published`: a Release created here by the built-in GITHUB_TOKEN
# would not chain into another workflow anyway, so keying both jobs off the tag
# push is simpler and avoids a double build.)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # manual run from a branch: publishes a short-sha image only

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # puradox/obsidian-sync-git

jobs:
  # Turn the pushed tag into a published GitHub Release. Notes are generated
  # from the merged PRs / commits since the previous release.
  github-release:
    if: github.ref_type == 'tag'   # nothing to release on a manual branch dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Idempotent: re-running the workflow for an existing tag is a no-op.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping."
            exit 0
          fi
          # A pre-release semver tag has a suffix after a hyphen (e.g. v1.2.3-rc.1).
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            $prerelease

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + Buildx enable the linux/arm64 build (the Dockerfile already
      # selects the right supercronic arch and better-sqlite3 prebuilds).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags + OCI labels. A semver tag like v1.2.3 yields 1.2.3 / 1.2 / 1
      # plus `latest`; a prerelease tag (v1.2.3-rc.1) skips `latest`. A manual
      # workflow_dispatch from a branch has no semver, so only sha-<short> applies.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,format=short

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Also read CI's cache: a release typically follows a merge to main
          # that CI just built, so its amd64 layers are already warm.
          cache-from: |
            type=gha,scope=release
            type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=release
          # SLSA provenance + SBOM attestations (best practice for a pulled-and-run
          # image). These appear as extra "unknown/unknown" manifests in the GHCR
          # package UI — that's expected. Set both to false to drop them.
          provenance: mode=max
          sbom: true
